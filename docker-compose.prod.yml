services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: betway_booking
    volumes:
      - betway_booking_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: build
    image: betway-booking-backend:prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/betway_booking
      CORS_ORIGIN: ${CORS_ORIGIN}
    command: sh -c "npx prisma migrate deploy && node dist/src/index.js"
    ports:
      - "8080:3000"

volumes:
  betway_booking_pg_prod:
