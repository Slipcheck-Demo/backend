services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betway_booking
    ports:
      - "5433:5432"
    volumes:
      - betway_booking_pg:/var/lib/postgresql/data

volumes:
  betway_booking_pg:
